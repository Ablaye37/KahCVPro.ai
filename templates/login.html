<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Connexion - KahCVPro.ai</title>
    <link rel="stylesheet" href="/static/css/style.css">
</head>
<body>

<header>
    <h1>KahCVPro.ai</h1>

    <nav>
        <a href="/">Accueil</a>
        <a href="/register">Inscription</a>
    </nav>
</header>

<section class="hero">
    <h2>Connexion</h2>

    <form action="/login" method="post">

        <input
            type="email"
            name="email"
            placeholder="Adresse e-mail"
            required>

        <br><br>

        <input
            type="password"
            name="mot_de_passe"
            placeholder="Mot de passe"
            required>

        <br><br>

        <button type="submit">
            Se connecter
        </button>

    </form>
</section>

</body>
</html>
