<form action="/register" method="post">

    <input type="text"
           name="nom"
           placeholder="Nom complet"
           required>

    <br><br>

    <input type="email"
           name="email"
           placeholder="Adresse e-mail"
           required>

    <br><br>

    <input type="password"
           name="mot_de_passe"
           placeholder="Mot de passe"
           required>

    <br><br>

    <button type="submit">
        S'inscrire
    </button>

</form>
