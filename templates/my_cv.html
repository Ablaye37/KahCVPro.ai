<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CV Premium - KahCVPro.ai</title>
    <link rel="stylesheet" href="/static/css/style.css">
</head>

<body>

<header>
    <h1>KahCVPro.ai</h1>

    <nav>
        <a href="/">Accueil</a>
        <a href="/dashboard">Dashboard</a>
        <a href="/create-cv">Créer un CV</a>
    </nav>
</header>


<section>

{% for cv in cvs %}

<div class="cv-premium">


    <div class="cv-header">

        <h2>{{ cv.nom }}</h2>

        <p>
            📧 {{ cv.email }} <br>
            📱 {{ cv.telephone }}
        </p>

    </div>


    <div class="cv-section">

        <h3>Profil professionnel</h3>

        <p>{{ cv.profil }}</p>

    </div>



    <div class="cv-section">

        <h3>Expérience professionnelle</h3>

        <p>{{ cv.experience }}</p>

    </div>



    <div class="cv-section">

        <h3>Formation</h3>

        <p>{{ cv.formation }}</p>

    </div>



    <div class="cv-section">

        <h3>Compétences</h3>

        <p>{{ cv.competences }}</p>

    </div>


    <div class="cv-actions">

        <a href="/improve-cv/{{ cv.id }}">
            <button>🤖 Améliorer avec IA</button>
        </a>


        <a href="/download-pdf/{{ cv.id }}">
            <button>📄 Télécharger PDF</button>
        </a>

    </div>


</div>

{% endfor %}

</section>


</body>
</html>
